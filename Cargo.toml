[workspace]
resolver = "3"
members = ["xtask", "lab-ui"]
default-members = [".", "lab-ui"]
# EXCLUI libs/ do workspace â€” junto com o [patch.crates-io] Ã© o que faz os
# crates vendored daqui valerem (sem o exclude o cargo tenta resolver eles
# como members e os patches silenciam).
exclude = ["libs"]

# Forks vendored (egui 6d518fc, winit a517b38) â€” receita no AGENTS.md do local-office.
[patch.crates-io]
ecolor = { path = "libs/egui/crates/ecolor/" }
emath = { path = "libs/egui/crates/emath/" }
epaint = { path = "libs/egui/crates/epaint/" }
epaint_default_fonts = { path = "libs/egui/crates/epaint_default_fonts/" }
egui = { path = "libs/egui/crates/egui/" }
egui-winit = { path = "libs/egui/crates/egui-winit/" }
egui-wgpu = { path = "libs/egui/crates/egui-wgpu/" }
egui_glow = { path = "libs/egui/crates/egui_glow/" }
egui_extras = { path = "libs/egui/crates/egui_extras/" }
egui_kittest = { path = "libs/egui/crates/egui_kittest/" }
egui_system_font_provider = { path = "libs/egui/crates/egui_system_font_provider/" }
eframe = { path = "libs/egui/crates/eframe/" }
egui_demo_lib = { path = "libs/egui/crates/egui_demo_lib/" }
egui_inspection = { path = "libs/egui/crates/egui_inspection/" }
winit = { path = "libs/winit/" }

[package]
name = "local-player"
version = "0.11.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/Anon5T4R/Local-Player"
description = "Player de mÃ­dia 100% local e offline (mpv embutido) â€” piloto egui da avaliaÃ§Ã£o da suÃ­te Local"

[build-dependencies]
# Embute o Ã­cone no .exe (Windows) â€” sem isso o Explorer mostra Ã­cone genÃ©rico.
winresource = "0.1"

[dependencies]
eframe = "0.37"
egui = "0.37"
lab-ui = { path = "lab-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ãcone da janela (mesmo desenho do Local-Keys: include_bytes + decode)
image = "0.25"
# Autoupdate: HTTP sync + tar.gz (Linux; Windows usa o setup.exe baixado)
ureq = { version = "2", features = ["json"] }
flate2 = "1"
tar = "0.4"
# SHA-256 do mpv baixado (o espelho Ã© da suÃ­te, mas o binÃ¡rio confere)
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# IPC com o mpv via named pipe (handle Ãºnico + leitura nÃ£o-bloqueante â€”
# ver mpv.rs) + download/extraÃ§Ã£o do mpv portÃ¡til (ureq + sevenz-rust2,
# Rust puro). DiÃ¡logo nativo (rfd; no Linux o caminho Ã© digitado â€”
# polÃ­tica do lab: AppImage enxuto).
windows = { version = "0.58", features = [
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
rfd = { version = "0.17", default-features = false }
sevenz-rust2 = "0.21"

[target.'cfg(unix)'.dependencies]
# Child X11 pro embed do vÃ­deo (--wid do mpv); rwh expÃµe o XID da janela
# eframe (X11/XWayland â€” Wayland puro cai pro mpv em janela prÃ³pria).
x11rb = { version = "0.13", default-features = false }
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"



