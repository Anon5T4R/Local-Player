[workspace]
resolver = "3"
members = ["xtask", "lab-ui"]
default-members = [".", "lab-ui"]
# EXCLUI libs/ do workspace — junto com o [patch.crates-io] é o que faz os
# crates vendored daqui valerem (sem o exclude o cargo tenta resolver eles
# como members e os patches silenciam).
exclude = ["libs"]

# Forks vendored (egui 6d518fc, winit a517b38) — receita no AGENTS.md do local-office.
[patch.crates-io]
ecolor = { path = "libs/egui/crates/ecolor/" }
emath = { path = "libs/egui/crates/emath/" }
epaint = { path = "libs/egui/crates/epaint/" }
epaint_default_fonts = { path = "libs/egui/crates/epaint_default_fonts/" }
egui = { path = "libs/egui/crates/egui/" }
egui-winit = { path = "libs/egui/crates/egui-winit/" }
egui-wgpu = { path = "libs/egui/crates/egui-wgpu/" }
egui_glow = { path = "libs/egui/crates/egui_glow/" }
egui_extras = { path = "libs/egui/crates/egui_extras/" }
egui_kittest = { path = "libs/egui/crates/egui_kittest/" }
egui_system_font_provider = { path = "libs/egui/crates/egui_system_font_provider/" }
eframe = { path = "libs/egui/crates/eframe/" }
egui_demo_lib = { path = "libs/egui/crates/egui_demo_lib/" }
egui_inspection = { path = "libs/egui/crates/egui_inspection/" }
winit = { path = "libs/winit/" }

[package]
name = "local-player"
version = "0.11.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/Anon5T4R/Local-Player"
description = "Player de mídia 100% local e offline (mpv embutido) — piloto egui da avaliação da suíte Local"

[build-dependencies]
# Embute o ícone no .exe (Windows) — sem isso o Explorer mostra ícone genérico.
winresource = "0.1"

[dependencies]
eframe = "0.37"
egui = "0.37"
lab-ui = { path = "lab-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ícone da janela (mesmo desenho do Local-Keys: include_bytes + decode)
image = "0.25"
# Autoupdate: HTTP sync + zip/tar.gz (mesmo desenho do Local-Keys)
ureq = { version = "2", features = ["json"] }
zip = "2"
flate2 = "1"
tar = "0.4"
# SHA-256 do mpv baixado (o espelho é da suíte, mas o binário confere)
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# IPC com o mpv via named pipe (handle único + leitura não-bloqueante —
# ver mpv.rs) + download/extração do mpv portátil (ureq + sevenz-rust2,
# Rust puro). Diálogo nativo (rfd; no Linux o caminho é digitado —
# política do lab: AppImage enxuto).
windows = { version = "0.58", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
rfd = { version = "0.17", default-features = false }
sevenz-rust2 = "0.21"

[target.'cfg(unix)'.dependencies]
# Child X11 pro embed do vídeo (--wid do mpv); rwh expõe o XID da janela
# eframe (X11/XWayland — Wayland puro cai pro mpv em janela própria).
x11rb = { version = "0.13", default-features = false }
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
