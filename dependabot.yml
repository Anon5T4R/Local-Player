version: 2
updates:
  # Dependências Cargo são pinadas por política (local-deps/WORKFLOW.md): mudam
  # só pelo fluxo de inventário + changelog, então sem ecossistema cargo aqui.
  # Mantém os GitHub Actions dos workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
