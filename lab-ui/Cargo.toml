[package]
name = "lab-ui"
version = "0.10.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Tema, i18n e config comuns dos pilotos egui da suíte Local"

[dependencies]
craft-i18n = { path = "../libs/craft-libs/crates/i18n" }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Área útil do monitor (SPI_GETWORKAREA + taskbar auto-hide) pro clamp
# das janelas "no tamanho do conteúdo" (workarea.rs).
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
